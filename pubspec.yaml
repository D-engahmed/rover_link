name: rover_link
description: Unified control + AI copilot app for the HC-05 / STM32F401 rover.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Android-only classic Bluetooth (RFCOMM/SPP) for HC-05/STM32 serial control.
  bluetooth_classic: ^0.0.4
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
