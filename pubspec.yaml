name: rover_link
description: Unified Smart Autonomous Rover control app — mission control, manual drive, radar, and AI navigation for an STM32-based rover.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HC-05 is classic Bluetooth (SPP), not BLE, so this needs a classic-serial
  # package rather than flutter_blue_plus / flutter_reactive_ble. Android
  # only — iOS does not expose the classic SPP profile to third-party apps.
  flutter_bluetooth_serial: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
