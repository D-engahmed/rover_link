name: rover_link
description: Unified control + AI copilot app for the HC-05 / STM32F401 rover.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Android-only classic Bluetooth (RFCOMM/SPP). Verified publisher, small
  # API surface, built for exactly this use case (HC-05/ESP32/Arduino serial).
  # If constants.useDemoBluetooth stays true you don't need this yet — the
  # demo transport has no dependency on it at all.
  bluetooth_classic: ^0.0.4
  # Official Flutter team camera plugin.
  camera: ^0.11.0
  # flutter-ml.dev (verified publisher) — actively maintained, includes
  # recent AGP8/compileSdk-35 fixes per its changelog (checked before
  # picking this, after bluetooth_classic's compileSdk problem).
  google_mlkit_face_detection: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
